<!DOCTYPE html>
<!--
  Copyright (c) Microsoft Corporation.
  Licensed under the MIT License.

  Browser front-end for the Edit terminal editor compiled to WebAssembly.

  Build the WASM package first:
    cargo install wasm-pack
    wasm-pack build crates/edit-wasm --target web --out-dir ../../web/pkg

  Then serve this directory with any static HTTP server, e.g.:
    npx serve web/
    python3 -m http.server --directory web/ 8080
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- HTML Meta Tags -->
  <title>Edit – Terminal Editor in the Browser</title>
  <meta name="description" content="Run Microsoft Edit, a terminal text editor, anywhere, anytime, entirely in your browser via WebAssembly." />

  <!-- Facebook / Open Graph -->
  <meta property="og:url" content="https://ms-edit-wasm.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Edit – Terminal Editor in the Browser" />
  <meta property="og:description" content="Run Microsoft Edit, a terminal text editor, anywhere, anytime, entirely in your browser via WebAssembly." />
  <meta property="og:image" content="https://ms-edit-wasm.vercel.app/social.png" />

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="twitter:domain" content="ms-edit-wasm.vercel.app" />
  <meta property="twitter:url" content="https://ms-edit-wasm.vercel.app/" />
  <meta name="twitter:title" content="Edit – Terminal Editor in the Browser" />
  <meta name="twitter:description" content="Run Microsoft Edit, a terminal text editor, anywhere, anytime, entirely in your browser via WebAssembly." />
  <meta name="twitter:image" content="https://ms-edit-wasm.vercel.app/social.png" />

  <!-- Mobile tweaks -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Edit" />
  <link rel="apple-touch-icon" href="icons/edit-192.png" />

  <meta name="theme-color" content="#1e1e1e" />
  <!-- Disable pinch zooming -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/x-icon" href="icons/edit.ico" />
  <link rel="icon" type="image/svg+xml" href="icons/edit.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #1e1e1e;
      overflow: hidden;
    }

    #terminal-container {
      width: 100%;
      height: 100%;
      /* xterm.js fills this element */
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e1e;
      color: #ccc;
      font-family: monospace;
      font-size: 1rem;
      z-index: 10;
      transition: opacity 0.3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>

  <!-- xterm.js from CDN -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11/lib/addon-fit.js"></script>
</head>
<body>
  <div id="loading">Loading editor…</div>
  <div id="terminal-container"></div>

  <script type="module" src="main.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
